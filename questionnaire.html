<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Votre avis sur un pack cinéma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
body{padding:0 16px;font-family:var(--display)}
.q-wrap{max-width:680px;margin:0 auto;padding-block:28px 64px;display:grid;gap:20px}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 .8rem var(--mono);color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0;border-radius:999px;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
.testmode{font:500 .78rem var(--mono);background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 12px}

.step{display:grid;gap:16px}
.step-head{display:grid;gap:6px;margin-bottom:4px}
.step-head .kicker{font:600 .75rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.step h1{font:800 clamp(1.7rem,4.5vw,2.3rem)/1.1 var(--display);margin:0}
.step h2{font:800 1.45rem/1.2 var(--display);margin:0}
.step p{margin:0;font:400 1rem/1.6 var(--body);color:var(--ink)}
.step .hint{color:var(--muted);font-size:.95rem}

/* une question = une carte */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;margin:0}
fieldset.qcard{min-width:0}
.qtitle{display:flex;gap:12px;align-items:flex-start;font:700 1.05rem/1.35 var(--display);color:var(--ink);float:left;width:100%;padding:0;margin-bottom:12px}
.qtitle + *{clear:both}
.qnum{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:999px;background:var(--accent);color:#fff;font:800 .9rem var(--display)}
.qsub{display:block;font:400 .88rem/1.4 var(--body);color:var(--muted);margin-top:2px}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.choice{display:flex;gap:10px;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font:500 .97rem/1.3 var(--display);transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--muted)}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{accent-color:var(--accent);width:18px;height:18px;flex:none;margin:0}
.sub{font:700 .92rem var(--display);color:var(--muted);margin-top:4px}
.other{font:500 1rem var(--display);padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}

.euro{display:flex;align-items:center;gap:10px}
.euro input{font:700 1.2rem var(--mono);width:150px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.euro span{font:700 1.15rem var(--mono);color:var(--muted)}

/* échelle de 1 à 7 */
.lk-group{display:grid;gap:10px}
.lk-group h3{font:700 .8rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.lk-item{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.lk-item .txt{font:600 .98rem/1.35 var(--display)}
.s7{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.s7 label{display:grid;place-items:center;height:40px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font:700 .95rem var(--mono);background:var(--surface);transition:border-color .15s,background .15s}
.s7 label:hover{border-color:var(--muted)}
.s7 label:has(input:checked){border-color:var(--accent);background:var(--accent);color:#fff}
.s7 input{position:absolute;opacity:0;pointer-events:none}
.s7 label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.legend7{display:flex;justify-content:space-between;font:500 .78rem var(--mono);color:var(--muted);padding:0 2px}

/* tableaux */
.mx{display:grid;gap:6px}
.mx-row{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(var(--cols),minmax(0,1fr));gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mx-head{background:none;border:0;padding:0 12px;font:600 .72rem/1.2 var(--mono);color:var(--muted);text-align:center}
.mx-l{font:600 .95rem/1.3 var(--display)}
.mx-row label{display:grid;place-items:center;padding:6px 0;cursor:pointer}
.mx-row input{accent-color:var(--accent);width:20px;height:20px}
@media (max-width:480px){.mx-row{grid-template-columns:minmax(0,1.2fr) repeat(var(--cols),minmax(0,1fr));padding:10px 8px}.mx-head{font-size:.62rem;padding:0 8px}.mx-l{font-size:.88rem}}

/* Gabor-Granger */
.gg-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.gg-row .p{font:800 1.25rem var(--mono)}
.gg-row .yn{display:flex;gap:8px}
.gg-row .yn label{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;font:600 .95rem var(--display);background:var(--surface)}
.gg-row .yn label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* l'offre */
.offer{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:20px;display:grid;gap:12px}
.offer .name{font:800 1.3rem var(--display);text-align:center}
.o-row{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:start;gap:6px;text-align:center}
.o-item{display:grid;justify-items:center;gap:2px}
.o-item strong{font:700 1rem var(--display)}
.o-item span:last-child{font-size:.8rem;color:var(--muted);line-height:1.3}
.o-ic svg{width:58px;height:58px;display:block}
.o-plus{font:800 1.6rem var(--display);color:var(--accent-ink);padding-top:16px}
.o-price{justify-self:center;font:800 1.6rem var(--display);background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 20px}
.offer .small{font-size:.85rem;color:var(--muted);text-align:center}
.offer .ref{justify-self:center;text-align:center;font:700 1rem var(--display);color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:7px 16px}
@media (max-width:420px){.o-ic svg{width:46px;height:46px}.o-plus{font-size:1.3rem;padding-top:10px}}

.choices.col{grid-template-columns:1fr}
.lk-group{display:grid;gap:18px}
.lk-item .txt{display:block;font-weight:600;margin-bottom:8px}
.lk7{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lk7 label{display:grid;place-items:center;text-align:center;min-height:52px;padding:6px 4px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font:600 .78rem/1.2 var(--display);background:var(--surface);transition:border-color .15s,background .15s}
.lk7 label:hover{border-color:var(--muted)}
.lk7 label:has(input:checked){border-color:var(--accent);background:var(--accent);color:#fff}
.lk7 input{position:absolute;opacity:0;pointer-events:none}
.lk7 label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:700px){.lk7{grid-template-columns:1fr}.lk7 label{min-height:0;padding:10px 12px;place-items:start;text-align:left;font-size:.92rem}}.sd-group{display:grid;gap:18px}
.sd-item .txt{display:block;font-weight:600;margin-bottom:8px}
.sd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.sd-end{font-size:.86rem;color:var(--muted);line-height:1.25}
.sd-end.neg{text-align:right}
.sd-dots{display:flex;gap:6px}
.sd-dots label{cursor:pointer;display:grid;place-items:center;width:34px;height:34px}
.sd-dots input{position:absolute;opacity:0;pointer-events:none}
.sd-dots span{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);transition:border-color .15s,background .15s,transform .15s}
.sd-dots label:hover span{border-color:var(--muted)}
.sd-dots input:checked+span{background:var(--accent);border-color:var(--accent);transform:scale(1.12)}
.sd-dots input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:620px){.sd{grid-template-columns:1fr 1fr;gap:6px 10px}.sd-dots{grid-column:1/-1;grid-row:2;justify-content:space-between}.sd-end.neg{text-align:left}.sd-end.pos{text-align:right}.sd-dots label{width:auto;flex:1}}.gg-row[hidden]{display:none}.err{color:var(--bad);font:600 .95rem var(--display);min-height:1.2em;margin:0}
.nav-q{display:flex;justify-content:space-between;gap:10px}
.btn{font:700 1rem var(--display);border-radius:999px;padding:13px 26px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[hidden]{display:none}
</style>
</head>
<body>
<div class="q-wrap">
  <div class="q-top"><span>Étude M1 Marketing · IAE Clermont Auvergne</span><span id="count"></span></div>
  <div class="bar" aria-hidden="true"><span id="progress"></span></div>
  <div id="testmode" class="testmode" hidden>Mode test : les réponses ne sont pas envoyées (adresse d'enregistrement non configurée).</div>
  <form id="form" novalidate>
    <div id="steps"></div>
    <p class="err" id="err" role="alert"></p>
    <div class="nav-q">
      <button type="button" class="btn ghost" id="prev">Retour</button>
      <button type="submit" class="btn" id="next">Commencer</button>
    </div>
  </form>
</div>

<script>
/* ================== RÉGLAGES DU GROUPE ================== */
const CONFIG = {
  // Adresse de l'application Google Apps Script qui enregistre dans Google Sheets (voir prix-psychologique.html).
  ENDPOINT: "https://script.google.com/macros/s/AKfycbyvD-00uuhXcXurZtePV09qsy3-6L_hXOkmc0BoLtAec18zW_ufGWmQSkpBK8UQIQGH/exec",
  // Prix de référence montré dans la version B : place plein tarif + menu, achetés séparément.
  // À METTRE À JOUR après le relevé en caisse (13,50 € + prix réel du menu).
  PRIX_SEPARES: 22.00,
  // Prix testés en Gabor-Granger. Affichés du plus petit au plus grand, un par un : on passe au suivant seulement après un « oui ».
  GG_PRIX: [18.90, 17.90, 16.90],
  // Prix du pack montré au moment des phrases à noter (identique en version A et B).
  PRIX_PACK: 18.90
};
/* ======================================================== */

const fmt = v => v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const rid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const isAmount = v => /^\d+(\.\d+)?$/.test(v) && Number(v) <= 500;

// Test A/B : tirage au sort à l'ouverture, une seule fois par répondant
const VERSION = Math.random() < 0.5 ? "A" : "B";
const START = Date.now();
const answers = { id: rid(), version: VERSION };

/* ---------- l'offre en image ---------- */
const ICONS = {
  ticket: `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 18h48v8a6 6 0 0 0 0 12v8H8v-8a6 6 0 0 0 0-12z" fill="var(--accent-soft)" stroke="var(--accent-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M40 20v24" stroke="var(--accent-ink)" stroke-width="2.5" stroke-dasharray="3 4"/><path d="M18 30h14M18 36h10" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round"/></svg>`,
  popcorn: `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="22" cy="20" r="7" fill="#F6E7CB" stroke="var(--accent-ink)" stroke-width="2.5"/><circle cx="32" cy="15" r="8" fill="#F6E7CB" stroke="var(--accent-ink)" stroke-width="2.5"/><circle cx="42" cy="20" r="7" fill="#F6E7CB" stroke="var(--accent-ink)" stroke-width="2.5"/><path d="M14 24h36l-5 32H19z" fill="#fff" stroke="var(--accent-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M26 24l2 32M38 24l-2 32" stroke="#C9372C" stroke-width="4"/></svg>`,
  drink: `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M36 6l-4 14" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round"/><path d="M18 20h28l-4 38H22z" fill="#CFE3F7" stroke="var(--accent-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M16 20h32" stroke="var(--accent-ink)" stroke-width="4" stroke-linecap="round"/><path d="M21 34h22" stroke="var(--accent-ink)" stroke-width="2" opacity=".6"/></svg>`
};
function offerHTML(withPrice) {
  const item = (icon, title, sub) => `<div class="o-item"><span class="o-ic">${ICONS[icon]}</span><strong>${title}</strong><span>${sub}</span></div>`;
  return `<div class="offer" aria-label="Pack Ciné Pathé : 1 place de cinéma, 1 popcorn moyen et 1 boisson de 50 centilitres">
    <span class="name">Pack Ciné Pathé</span>
    <div class="o-row">
      ${item("ticket", "1 place", "hors IMAX et 4DX")}
      <span class="o-plus" aria-hidden="true">+</span>
      ${item("popcorn", "1 popcorn", "moyen, sucré ou salé")}
      <span class="o-plus" aria-hidden="true">+</span>
      ${item("drink", "1 boisson", "50 cl")}
    </div>
    <span class="small">Tous les jours, chez Pathé · en ligne ou en caisse</span>
    ${withPrice ? `<span class="o-price">${fmt(CONFIG.PRIX_PACK)}</span>` : ""}
    ${VERSION === "B" ? `<span class="ref">Achetés séparément : ${fmt(CONFIG.PRIX_SEPARES)}</span>` : ""}
  </div>`;
}

/* ---------- briques d'interface : une question = une carte ---------- */
const title = (num, label, sub) => `<legend class="qtitle"><span class="qnum">${num}</span><span>${label}${sub ? `<span class="qsub">${sub}</span>` : ""}</span></legend>`;
const choices = (name, opts, type = "radio") => `<div class="choices">${opts.map((o, i) => `<label class="choice"><input type="${type}" name="${name}" value="${o[0]}" id="${name}-${i}"> ${o[1]}</label>`).join("")}</div>`;
const question = (num, name, label, opts, sub) => `<fieldset class="qcard">${title(num, label, sub)}${choices(name, opts)}</fieldset>`;
const checks = (num, name, label, opts, sub) => `<fieldset class="qcard">${title(num, label, sub)}${choices(name, opts, "checkbox")}</fieldset>`;
const euro = (num, name, label, sub) => `<fieldset class="qcard">${title(num, label, sub)}<div class="euro"><input type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" id="${name}" name="${name}" data-money="1" aria-label="Montant en euros"><span>€</span></div></fieldset>`;
const scale7 = (name, label) => `<div class="lk-item" role="radiogroup" aria-label="${label}"><span class="txt">${label}</span>
  <div class="s7">${[1, 2, 3, 4, 5].map(v => `<label><input type="radio" name="${name}" value="${v}"><span>${v}</span></label>`).join("")}</div></div>`;
const matrix = (num, label, rows, cols, sub) => `<fieldset class="qcard">${title(num, label, sub)}
  <div class="mx" style="--cols:${cols.length}">
    <div class="mx-row mx-head"><span></span>${cols.map(c => `<span>${c[1]}</span>`).join("")}</div>
    ${rows.map(([name, l]) => `<div class="mx-row"><span class="mx-l">${l}</span>${cols.map(c => `<label aria-label="${l} : ${c[1]}"><input type="radio" name="${name}" value="${c[0]}"></label>`).join("")}</div>`).join("")}
  </div></fieldset>`;
const head = (kicker, h, p) => `<div class="step-head"><span class="kicker">${kicker}</span><h2>${h}</h2>${p ? `<p class="hint">${p}</p>` : ""}</div>`;

/* ---------- briques supplémentaires ---------- */
// Échelle de Likert en 5 points, chaque point nommé
const AGREE5 = [["1", "Pas du tout d'accord"], ["2", "Plutôt pas d'accord"], ["3", "Neutre"], ["4", "Plutôt d'accord"], ["5", "Tout à fait d'accord"]];
const likert5 = (name, label) => `<div class="lk-item" role="radiogroup" aria-label="${label}"><span class="txt">${label}</span>
  <div class="lk7">${AGREE5.map(([v, t]) => `<label><input type="radio" name="${name}" value="${v}"><span>${t}</span></label>`).join("")}</div></div>`;
// Valeur perçue : 3 items de Dodds, Monroe et Grewal (1991, annexe p. 318), traduits et adaptés au pack
const VALEUR = [
  ["vp_bonne_affaire", "Ce pack est une bonne affaire."],
  ["vp_prix_acceptable", "Le prix de ce pack est acceptable."],
  ["vp_qualite_prix", "Ce pack offre un bon rapport qualité-prix."]
];
const column = (name, opts, type = "radio") => `<div class="choices col">${opts.map((o, i) => `<label class="choice"><input type="${type}" name="${name}" value="${o[0]}" id="${name}-${i}"> ${o[1]}</label>`).join("")}</div>`;
const otherField = (name, ph) => `<input class="other" type="text" name="${name}" id="${name}" placeholder="${ph}" maxlength="150" aria-label="Précisez votre réponse">`;
const has = (v, x) => String(v || "").split(";").includes(x);

/* ---------- listes ---------- */
const ENSEIGNES = [["pathe", "Pathé"], ["cgr", "CGR"], ["ugc", "UGC"], ["kinepolis", "Kinepolis"], ["megarama", "Mégarama"], ["independant", "Un cinéma indépendant"]];

const RAISONS = [["rx_economie", "L'économie réalisée"], ["rx_pratique", "Tout acheter en une fois, en ligne"], ["rx_queue", "Ne pas faire la queue au comptoir"]];
const IMPORTANCE = [["pas", "Pas du tout"], ["peu", "Un peu"], ["beaucoup", "Beaucoup"]];
const CANAUX = [["cn_appli", "Application ou site"], ["cn_caisse", "En caisse"], ["cn_carte", "Carte ou comité d'entreprise"]];
const FREQ4 = [["jamais", "Jamais"], ["parfois", "Parfois"], ["souvent", "Souvent"], ["toujours", "Toujours"]];
const GG_ASC = CONFIG.GG_PRIX.slice().sort((a, b) => a - b);   // du plus petit au plus grand

const STEPS = [
  { id: "accueil", button: "Commencer", html: () => `<div class="step">
      <div class="step-head"><span class="kicker">Questionnaire · 3 minutes</span><h1>Votre avis sur un pack cinéma</h1></div>
      <p>Nous sommes des étudiants en Master 1 Marketing à l'IAE Clermont Auvergne. Nous étudions le prix d'une offre de cinéma.</p>
      <p class="hint">Le questionnaire est <strong>anonyme</strong> : ni nom, ni e-mail, ni adresse IP. Les réponses servent uniquement à ce travail universitaire.</p>
      <fieldset class="qcard">${choices("consentement", [["oui", "J'accepte de participer"], ["non", "Je ne souhaite pas participer"]])}</fieldset>
    </div>`,
    check: f => f.consentement ? "" : "Indiquez si vous acceptez de participer.",
    stop: f => f.consentement === "non" },

  { id: "vous", html: () => `<div class="step">
      ${head("Partie 1 sur 5", "Vous et le cinéma")}
      <fieldset class="qcard">${title(1, "Quand êtes-vous allé au cinéma pour la dernière fois ?")}
        ${column("derniere_seance", [["1s", "Il y a moins d'une semaine"], ["1m", "Entre 1 semaine et 1 mois"], ["6m", "Entre 1 et 6 mois"], ["12m", "Entre 6 mois et 1 an"], ["plus", "Il y a plus d'un an"], ["jamais", "Jamais, ou je ne m'en souviens plus"]])}
      </fieldset>
      <fieldset class="qcard">${title(2, "Lors de cette dernière séance, qu'avez-vous acheté ?", "Plusieurs réponses possibles.")}
        ${choices("achats", [["place", "Une place"], ["popcorn", "Du pop-corn"], ["snacks", "D'autres snacks (bonbons, chocolat, nachos…)"], ["boissons", "Des boissons"], ["derives", "Des produits dérivés (affiches, goodies…)"], ["nsp", "Je ne sais plus"]], "checkbox")}
      </fieldset>
      <fieldset class="qcard">${title(3, "Avec qui allez-vous au cinéma ?", "Plusieurs réponses possibles.")}
        ${choices("avec_qui", [["seul", "Seul"], ["couple", "En couple"], ["famille", "En famille"], ["amis", "Entre amis"], ["jamais", "Je n'y vais pas"]], "checkbox")}
      </fieldset>
      ${question(4, "cinema", "Dans quel cinéma allez-vous le plus souvent ?", ENSEIGNES.concat([["autre", "Un autre cinéma"], ["aucun", "Aucun"]]))}
      <fieldset class="qcard">${title(5, "Quelle est votre situation ?")}
        ${choices("situation", [["etudiant", "Étudiant"], ["actif", "Actif"], ["sans_emploi", "Sans emploi"], ["retraite", "Retraité"], ["autre", "Autre"]])}
        ${otherField("situation_autre", "Si « Autre », précisez")}
      </fieldset>
    </div>`,
    check: f => {
      if (!f.derniere_seance) return "Question 1 : choisissez une réponse.";
      if (!f.achats) return "Question 2 : cochez au moins une réponse.";
      if (has(f.achats, "nsp") && f.achats.includes(";")) return "Question 2 : vous avez coché « Je ne sais plus » et un achat, corrigez votre réponse.";
      if (!f.avec_qui) return "Question 3 : cochez au moins une réponse.";
      if (has(f.avec_qui, "jamais") && f.avec_qui.includes(";")) return "Question 3 : vous avez coché « Je n'y vais pas » et une autre réponse, corrigez votre réponse.";
      if (!f.cinema) return "Question 4 : choisissez une réponse.";
      if (!f.situation) return "Question 5 : choisissez une réponse.";
      if (f.situation === "autre" && !f.situation_autre) return "Question 5 : précisez votre situation.";
      return "";
    } },

  { id: "offre", button: "J'ai regardé l'offre", html: () => `<div class="step">
      ${head("Partie 2 sur 5", "Voici l'offre", "Regardez-la bien : les questions suivantes portent sur elle.")}
      ${offerHTML(false)}
    </div>`, check: () => "" },

  { id: "prix", html: () => `<div class="step">
      ${head("Partie 2 sur 5", "Le prix du pack")}
      ${offerHTML(false)}
      <fieldset class="qcard">${title(6, "Achèteriez-vous ce pack à ce prix ?", "Les prix s'affichent l'un après l'autre.")}
        ${GG_ASC.map((p, i) => `<div class="gg-row" data-i="${i}"${i ? " hidden" : ""}><span class="p">${fmt(p)}</span><span class="yn"><label><input type="radio" name="gga_${i}" value="oui"> Oui</label><label><input type="radio" name="gga_${i}" value="non"> Non</label></span></div>`).join("")}
      </fieldset>
      ${matrix(7, "Est-ce que ces avantages vous donnent envie d'acheter le pack ?", RAISONS, IMPORTANCE, "Une réponse par ligne.")}
    </div>`,
    after: () => {
      // Gabor-Granger progressif : on affiche le prix suivant seulement après un « oui »
      const rows = [...stepsEl.querySelectorAll(".gg-row")];
      const update = () => {
        let stop = false;
        rows.forEach((r, i) => {
          const val = (r.querySelector("input:checked") || {}).value;
          if (stop) { r.hidden = true; r.querySelectorAll("input").forEach(x => x.checked = false); return; }
          r.hidden = false;
          if (val !== "oui") stop = true;
        });
      };
      rows.forEach(r => r.addEventListener("change", update));
      update();
    },
    check: f => {
      for (let i = 0; i < GG_ASC.length; i++) {
        const v = f["gga_" + i];
        if (!v) return "Question 6 : répondez oui ou non au prix affiché.";
        if (v === "non") break;
      }
      return RAISONS.every(([n]) => f[n]) ? "" : "Question 7 : répondez à chaque ligne du tableau.";
    } },

  { id: "avis", html: () => `<div class="step">
      ${head("Partie 3 sur 5", `Imaginons ce pack à ${fmt(CONFIG.PRIX_PACK)}`)}
      ${offerHTML(true)}
      <fieldset class="qcard">${title(8, "Êtes-vous d'accord avec ces phrases ?")}<div class="lk-group">${VALEUR.map(([n, l]) => likert5(n, l)).join("")}</div></fieldset>
    </div>`,
    check: f => VALEUR.every(([n]) => f[n]) ? "" : "Question 8 : répondez aux trois phrases." },
  { id: "habitudes", html: () => `<div class="step">
      ${head("Partie 4 sur 5", "Vos habitudes et les cinémas")}
      ${matrix(9, "Comment achetez-vous votre place ?", CANAUX, FREQ4)}
      <fieldset class="qcard">${title(10, "Selon vous, parmi ces enseignes de cinéma, laquelle est…")}
        <span class="sub">a. la moins chère ?</span>
        ${choices("cmp_prix", ENSEIGNES.concat([["nsp", "Je ne sais pas"]]))}
        <span class="sub">b. la plus agréable (confort, image, son) ?</span>
        ${choices("cmp_qualite", ENSEIGNES.concat([["nsp", "Je ne sais pas"]]))}
      </fieldset>
    </div>`,
    check: f => {
      if (!CANAUX.every(([n]) => f[n])) return "Question 9 : répondez à chaque ligne du tableau.";
      if (!f.cmp_prix || !f.cmp_qualite) return "Question 10 : répondez aux parties a et b.";
      return "";
    } },

  { id: "depenses", button: "Envoyer mes réponses", html: () => `<div class="step">
      ${head("Partie 5 sur 5", "Vos dépenses")}
      ${euro(11, "depense", "Combien dépensez-vous en pop-corn, snacks et boissons par séance de cinéma ?", "En moyenne. Écrivez 0 si vous n'en achetez jamais.")}
      <fieldset class="qcard">${title(12, "À quelles plateformes de vidéo êtes-vous abonné ?", "Vous ou votre foyer. Plusieurs réponses possibles.")}
        ${choices("plateformes", [["netflix", "Netflix"], ["disney", "Disney+"], ["prime", "Prime Video"], ["canal", "Canal+"], ["autre", "Une autre"], ["aucune", "Aucune"]], "checkbox")}
        ${otherField("plateformes_autre", "Si « Une autre », précisez laquelle")}
      </fieldset>
      ${euro(13, "depense_streaming", "Combien payez-vous au total par mois pour ces abonnements ?", "Écrivez 0 si vous n'en avez aucun.")}
    </div>`,
    check: f => {
      if (!f.depense || !isAmount(f.depense)) return "Question 11 : indiquez un montant en euros, par exemple 0, 6 ou 8,50.";
      if (!f.plateformes) return "Question 12 : cochez au moins une réponse (ou « Aucune »).";
      if (has(f.plateformes, "aucune") && f.plateformes.includes(";")) return "Question 12 : vous avez coché « Aucune » et une plateforme, corrigez votre réponse.";
      if (has(f.plateformes, "autre") && !f.plateformes_autre) return "Question 12 : précisez quelle autre plateforme.";
      if (!f.depense_streaming || !isAmount(f.depense_streaming)) return "Question 13 : indiquez un montant en euros, par exemple 0 ou 13,99.";
      return "";
    } }
];

/* ---------- moteur ---------- */
const stepsEl = document.getElementById("steps"), errEl = document.getElementById("err");
const nextBtn = document.getElementById("next"), prevBtn = document.getElementById("prev");
let cur = 0;
if (!CONFIG.ENDPOINT) document.getElementById("testmode").hidden = false;

function collect() {
  const f = {};
  stepsEl.querySelectorAll("input").forEach(i => {
    if (i.type === "radio") { if (i.checked) f[i.name] = i.value; }
    else if (i.type === "checkbox") { if (i.checked) f[i.name] = f[i.name] ? f[i.name] + ";" + i.value : i.value; else if (!(i.name in f)) f[i.name] = ""; }
    else if (i.dataset.money) f[i.name] = i.value.trim().replace(/\s|€/g, "").replace(",", ".");
    else f[i.name] = i.value.trim();
  });
  return f;
}
function restore() {
  stepsEl.querySelectorAll("input").forEach(i => {
    const v = answers[i.name];
    if (v == null) return;
    if (i.type === "radio") i.checked = i.value === v;
    else if (i.type === "checkbox") i.checked = has(v, i.value);
    else i.value = v;
  });
}
function render() {
  const s = STEPS[cur];
  stepsEl.innerHTML = s.html();
  restore();
  if (s.after) s.after();
  errEl.textContent = "";
  prevBtn.hidden = cur === 0;
  nextBtn.textContent = s.button || "Suivant";
  document.getElementById("progress").style.width = (cur / STEPS.length * 100) + "%";
  document.getElementById("count").textContent = cur === 0 ? "" : `Page ${cur} sur ${STEPS.length - 1}`;
  window.scrollTo(0, 0);
}
function endScreen(msg) {
  document.getElementById("form").innerHTML = `<div class="step"><div class="step-head"><span class="kicker">Terminé</span><h1>Merci !</h1></div><p>${msg}</p></div>`;
  document.getElementById("progress").style.width = "100%";
  document.getElementById("count").textContent = "";
}

function buildRow() {
  const n = k => (answers[k] === "" || answers[k] == null) ? "" : Number(answers[k]);
  const s = k => answers[k] == null ? "" : answers[k];
  const a = s("achats");
  const confiserie = ["popcorn", "snacks", "boissons"].some(x => has(a, x));
  const row = {
    id: answers.id, horodatage: new Date().toISOString(), version: VERSION,
    derniere_seance: s("derniere_seance"), achats: a,
    achat_place: has(a, "place") ? 1 : 0, achat_popcorn: has(a, "popcorn") ? 1 : 0, achat_snacks: has(a, "snacks") ? 1 : 0,
    achat_boissons: has(a, "boissons") ? 1 : 0, achat_derives: has(a, "derives") ? 1 : 0,
    type_client: has(a, "nsp") ? "" : (confiserie ? "B_avec_confiserie" : "A_sans_confiserie"),
    avec_qui: s("avec_qui"), cinema: s("cinema"),
    situation: s("situation"), situation_autre: answers.situation === "autre" ? s("situation_autre") : ""
  };
  // Gabor-Granger progressif (prix croissants) : un prix non affiché après un « non » compte comme « non »
  let seuil = "";
  GG_ASC.forEach((p, i) => {
    const ok = answers["gga_" + i] === "oui";
    row["gg_" + p.toFixed(2).replace(".", "_")] = ok ? 1 : 0;
    if (ok) seuil = p;
  });
  row.gg_prix_max_accepte = seuil;
  RAISONS.forEach(([k]) => { row[k] = s(k); });
  VALEUR.forEach(([k]) => { row[k] = n(k); });
  CANAUX.forEach(([k]) => { row[k] = s(k); });
  Object.assign(row, {
    cmp_prix: s("cmp_prix"), cmp_qualite: s("cmp_qualite"),
    depense: n("depense"), plateformes: s("plateformes"),
    plateformes_autre: has(answers.plateformes, "autre") ? s("plateformes_autre") : "",
    depense_streaming: n("depense_streaming"),
    // Test A/B : 1 = la personne a vu « Achetés séparément : 22,00 € » (version B), 0 = non (version A)
    vu_prix_22: VERSION === "B" ? 1 : 0,
    prix_separes_affiche: VERSION === "B" ? CONFIG.PRIX_SEPARES : "",
    prix_pack_affiche: CONFIG.PRIX_PACK,
    duree_sec: Math.round((Date.now() - START) / 1000)
  });
  return row;
}
async function send(row) {
  if (!CONFIG.ENDPOINT) { try { const k = "q-test-rows"; const x = JSON.parse(localStorage.getItem(k) || "[]"); x.push(row); localStorage.setItem(k, JSON.stringify(x)); } catch (e) {} console.log("Réponse (mode test) :", row); return true; }
  try {
    await fetch(CONFIG.ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(row) });
    return true;
  } catch (e) { return false; }
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = collect();
  const s = STEPS[cur];
  const msg = s.check(f);
  if (msg) { errEl.textContent = msg; return; }
  Object.assign(answers, f);
  if (s.stop && s.stop(f)) { endScreen("Vous avez choisi de ne pas participer. Bonne journée !"); return; }
  if (cur < STEPS.length - 1) { cur++; render(); return; }
  nextBtn.disabled = true; nextBtn.textContent = "Envoi…";
  const ok = await send(buildRow());
  if (ok) endScreen("Vos réponses ont bien été enregistrées. Merci pour votre participation !");
  else { nextBtn.disabled = false; nextBtn.textContent = "Réessayer l'envoi"; errEl.textContent = "L'envoi n'a pas fonctionné. Vérifiez votre connexion internet, puis réessayez."; }
});
prevBtn.addEventListener("click", () => { Object.assign(answers, collect()); if (cur > 0) { cur--; render(); } });
render();

</script>
</body>
</html>
