<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Votre avis sur un pack cinéma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
body{padding:0 16px}
.q-wrap{max-width:640px;margin:0 auto;padding-block:28px 56px;display:grid;gap:22px}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 .8rem var(--mono);color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
.step{display:grid;gap:22px}
.step h1{font-size:clamp(1.6rem,4.5vw,2.2rem)}
.step h2{font-size:1.3rem}
.step p{font-size:1.02rem}
.step h3{font:700 1.05rem var(--display);margin:6px 0 -8px}
.offer{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:20px 22px;display:grid;gap:10px}
.offer .name{font:800 1.35rem var(--display)}
.offer ul{margin:0;padding-left:20px;display:grid;gap:4px}
.offer .ref{font:600 1rem var(--display);color:var(--accent-ink);background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.o-row{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:start;gap:6px;text-align:center}
.o-item{display:grid;justify-items:center;gap:2px}
.o-item strong{font:700 1rem var(--display)}
.o-item span:last-child{font-size:.8rem;color:var(--muted);line-height:1.3}
.o-ic svg{width:58px;height:58px;display:block}
.o-plus{font:800 1.6rem var(--display);color:var(--accent-ink);padding-top:16px}
.o-price{justify-self:center;font:800 1.6rem var(--display);background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 18px}
.offer .ref{justify-self:center;text-align:center}
@media (max-width:420px){.o-ic svg{width:46px;height:46px}.o-plus{font-size:1.3rem;padding-top:10px}}
.field{display:grid;gap:8px}
.field > label,.field legend{font:600 1rem var(--display);padding:0}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:.98rem}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.euro{display:flex;align-items:center;gap:8px}
.euro input{font:600 1.15rem var(--mono);width:140px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.euro span{font:600 1.1rem var(--mono);color:var(--muted)}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.likert label{display:grid;justify-items:center;gap:4px;font:500 .72rem var(--mono);color:var(--muted);text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 2px;cursor:pointer}
.likert label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.likert input{accent-color:var(--accent)}
.gg-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.gg-row .p{font:700 1.1rem var(--mono)}
.gg-row .yn{display:flex;gap:6px}
.gg-row .yn label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.92rem}
.gg-row .yn label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.notes{display:grid;gap:8px}
.notes .row{display:grid;grid-template-columns:1fr 110px 110px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.notes .head{background:none;border:0;padding:0 12px;font:500 .78rem var(--mono);color:var(--muted)}
.notes .name{font:600 1rem var(--display)}
.notes select{font:500 .95rem var(--body);padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
@media (max-width:420px){.notes .row{grid-template-columns:1fr 92px 92px}}
.s7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.s7 label{display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 0;cursor:pointer;font:600 1rem var(--mono)}
.s7 label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.s7 input{position:absolute;opacity:0;pointer-events:none}
.s7 label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.s7-ends{display:flex;justify-content:space-between;gap:12px;font:500 .74rem var(--mono);color:var(--muted)}
.mx{display:grid;gap:6px}
.mx-row{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(var(--cols),minmax(0,1fr));gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mx-head{background:none;border:0;padding:0 10px;font:500 .66rem/1.2 var(--mono);color:var(--muted);text-align:center}
.mx-l{font-size:.92rem;line-height:1.3}
.mx-row label{display:grid;place-items:center;padding:6px 0;cursor:pointer}
.mx-row input{accent-color:var(--accent);width:18px;height:18px}
@media (max-width:480px){.mx-row{grid-template-columns:minmax(0,1.2fr) repeat(var(--cols),minmax(0,1fr));padding:8px 6px}.mx-head{font-size:.58rem;padding:0 6px}}.err{color:var(--bad);font:500 .9rem var(--display);min-height:1.2em}
.nav-q{display:flex;justify-content:space-between;gap:10px}
.btn{font:700 1rem var(--display);border-radius:999px;padding:12px 22px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.small{font-size:.85rem;color:var(--muted)}
.testmode{font:500 .78rem var(--mono);background:var(--accent-soft);color:var(--accent-ink);border-radius:6px;padding:6px 10px}
</style>
</head>
<body>
<div class="q-wrap">
  <div class="q-top"><span>Étude M1 Marketing · IAE Clermont Auvergne</span><span id="count"></span></div>
  <div class="bar" aria-hidden="true"><span id="progress"></span></div>
  <div id="testmode" class="testmode" hidden>Mode test : les réponses ne sont pas envoyées (adresse d'enregistrement non configurée).</div>
  <form id="form" novalidate>
    <div id="steps"></div>
    <p class="err" id="err" role="alert"></p>
    <div class="nav-q">
      <button type="button" class="btn ghost" id="prev">Retour</button>
      <button type="submit" class="btn" id="next">Commencer</button>
    </div>
  </form>
</div>

<script>
/* ================== RÉGLAGES DU GROUPE ================== */
const CONFIG = {
  // Adresse de l'application Google Apps Script qui enregistre dans Google Sheets (voir prix-psychologique.html).
  ENDPOINT: "",
  // Prix de référence montré dans la version B : place plein tarif + menu, achetés séparément.
  // À METTRE À JOUR après le relevé en caisse (13,50 € + prix réel du Menu Gourmand).
  PRIX_SEPARES: 22.00,
  // Prix testés en Gabor-Granger, présentés du plus cher au moins cher (ordre fixe pour tous).
  GG_PRIX: [19.90, 18.90, 17.90, 16.90, 15.90],
  // Prix du pack montré au moment des affirmations (identique en version A et B).
  PRIX_PACK: 18.90,
  // Enseignes notées de 1 à 10 (carte perceptuelle).
  ENSEIGNES: [["pathe", "Pathé"], ["cgr", "CGR"], ["ugc", "UGC"], ["kinepolis", "Kinepolis"]]
};
/* ======================================================== */

const fmt = v => v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const rid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));

// Tirage au sort à l'ouverture, une seule fois par répondant
const VERSION = Math.random() < 0.5 ? "A" : "B";
const START = Date.now();
const answers = { id: rid(), version: VERSION };

/* ---------- briques d'interface ---------- */
const ICONS = {
  ticket: `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 18h48v8a6 6 0 0 0 0 12v8H8v-8a6 6 0 0 0 0-12z" fill="var(--accent-soft)" stroke="var(--accent-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M40 20v24" stroke="var(--accent-ink)" stroke-width="2.5" stroke-dasharray="3 4"/><path d="M18 30h14M18 36h10" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round"/></svg>`,
  popcorn: `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="22" cy="20" r="7" fill="#F6E7CB" stroke="var(--accent-ink)" stroke-width="2.5"/><circle cx="32" cy="15" r="8" fill="#F6E7CB" stroke="var(--accent-ink)" stroke-width="2.5"/><circle cx="42" cy="20" r="7" fill="#F6E7CB" stroke="var(--accent-ink)" stroke-width="2.5"/><path d="M14 24h36l-5 32H19z" fill="#fff" stroke="var(--accent-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M26 24l2 32M38 24l-2 32" stroke="#C9372C" stroke-width="4"/></svg>`,
  drink: `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M36 6l-4 14" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round"/><path d="M18 20h28l-4 38H22z" fill="#CFE3F7" stroke="var(--accent-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M16 20h32" stroke="var(--accent-ink)" stroke-width="4" stroke-linecap="round"/><path d="M21 34h22" stroke="var(--accent-ink)" stroke-width="2" opacity=".6"/></svg>`
};
function offerHTML(withPrice, showRef = true) {
  const item = (icon, title, sub) => `<div class="o-item"><span class="o-ic">${ICONS[icon]}</span><strong>${title}</strong><span>${sub}</span></div>`;
  return `<div class="offer" aria-label="Pack Ciné Pathé : 1 place de cinéma, 1 popcorn moyen et 1 boisson de 50 centilitres">
    <span class="name">Pack Ciné Pathé</span>
    <div class="o-row">
      ${item("ticket", "1 place", "hors IMAX et 4DX")}
      <span class="o-plus" aria-hidden="true">+</span>
      ${item("popcorn", "1 popcorn", "moyen, sucré ou salé")}
      <span class="o-plus" aria-hidden="true">+</span>
      ${item("drink", "1 boisson", "50 cl")}
    </div>
    <span class="small">Tous les jours, chez Pathé · en ligne ou en caisse</span>
    ${withPrice ? `<span class="o-price">${fmt(CONFIG.PRIX_PACK)}</span>` : ""}
    ${VERSION === "B" && showRef ? `<span class="ref">Achetés séparément : ${fmt(CONFIG.PRIX_SEPARES)}</span>` : ""}
  </div>`;
}const radios = (name, opts) => `<div class="choices">${opts.map((o, i) => `<label class="choice"><input type="radio" name="${name}" value="${o[0]}" id="${name}-${i}"> ${o[1]}</label>`).join("")}</div>`;
const question = (name, label, opts) => `<fieldset class="field"><legend>${label}</legend>${radios(name, opts)}</fieldset>`;
const euro = (name, label) => `<div class="field"><label for="${name}">${label}</label><div class="euro"><input type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" id="${name}" name="${name}"><span>€</span></div></div>`;
const LIKERT = ["Pas du tout d'accord", "Plutôt pas d'accord", "Ni l'un ni l'autre", "Plutôt d'accord", "Tout à fait d'accord"];
const likert = (name, label) => `<fieldset class="field"><legend>${label}</legend><div class="likert">${LIKERT.map((t, i) => `<label><input type="radio" name="${name}" value="${i + 1}">${t}</label>`).join("")}</div></fieldset>`;
const noteSelect = name => `<select name="${name}" id="${name}" aria-label="${name}"><option value="">—</option>${Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join("")}<option value="nc">Je ne connais pas</option></select>`;
const isAmount = v => /^\d+(\.\d+)?$/.test(v) && Number(v) <= 500;

/* ---------- les questions ---------- */
/* ---------- nouvelles briques : échelle en 7 points, matrices, cases à cocher ---------- */
const scale7 = (name, label, left = "Pas du tout d'accord", right = "Tout à fait d'accord") => `<fieldset class="field"><legend>${label}</legend>
  <div class="s7">${[1, 2, 3, 4, 5, 6, 7].map(v => `<label><input type="radio" name="${name}" value="${v}"><span>${v}</span></label>`).join("")}</div>
  <div class="s7-ends"><span>${left}</span><span>${right}</span></div></fieldset>`;
const matrix = (title, rows, cols) => `<fieldset class="field"><legend>${title}</legend>
  <div class="mx" style="--cols:${cols.length}">
    <div class="mx-row mx-head"><span></span>${cols.map(c => `<span>${c[1]}</span>`).join("")}</div>
    ${rows.map(([name, label]) => `<div class="mx-row"><span class="mx-l">${label}</span>${cols.map(c => `<label aria-label="${label} : ${c[1]}"><input type="radio" name="${name}" value="${c[0]}"></label>`).join("")}</div>`).join("")}
  </div></fieldset>`;
const checks = (name, label, opts) => `<fieldset class="field"><legend>${label}</legend><div class="choices">${opts.map((o, i) => `<label class="choice"><input type="checkbox" name="${name}" value="${o[0]}" id="${name}-${i}"> ${o[1]}</label>`).join("")}</div></fieldset>`;
const AGREE5 = [["1", "Pas du tout d'accord"], ["2", "Plutôt pas d'accord"], ["3", "Ni l'un ni l'autre"], ["4", "Plutôt d'accord"], ["5", "Tout à fait d'accord"]];

/* ---------- les échelles de mesure ---------- */
// Valeur perçue et intention d'achat : adaptées de Dodds, Monroe et Grewal (1991), Journal of Marketing Research.
const VALEUR = [
  ["vp1", "Au prix indiqué, ce pack est une bonne affaire."],
  ["vp2", "Au prix indiqué, ce pack est économique."],
  ["vp3", "Le prix indiqué pour ce pack est acceptable."],
  ["vp4", "Ce pack offre un bon rapport qualité-prix."]
];
const INTENTION = [
  ["ia1", "Au prix indiqué, j'envisagerais d'acheter ce pack."],
  ["ia2", "La probabilité que j'achète ce pack est élevée."],
  ["ia3", "Je suis prêt(e) à acheter ce pack."],
  ["ia4", "Lors de ma prochaine séance chez Pathé, j'achèterais ce pack."]
];
const FREINS = [
  ["fr_cher", "Le popcorn et les boissons au cinéma sont trop chers."],
  ["fr_snacks", "Je préfère apporter mes propres snacks."],
  ["fr_envie", "Je n'ai pas envie de manger pendant un film."],
  ["fr_queue", "Faire la queue au comptoir me décourage."]
];
const CANAUX = [
  ["cn_appli", "Sur l'application ou le site du cinéma"],
  ["cn_caisse", "En caisse, au cinéma"],
  ["cn_carte", "Avec une carte prépayée, un abonnement ou un billet de comité d'entreprise"]
];
const FREQ3 = [["jamais", "Jamais"], ["parfois", "Parfois"], ["souvent", "Souvent"]];
const ITEMS_7 = VALEUR.concat(INTENTION);

const STEPS = [
  /* Accueil */
  { id: "accueil", button: "Commencer", html: () => `<div class="step">
      <h1>Votre avis sur un pack cinéma</h1>
      <p>Nous sommes des étudiants en Master 1 Marketing à l'IAE Clermont Auvergne. Dans le cadre d'un cours, nous étudions le prix d'une offre de cinéma.</p>
      <p><strong>Le questionnaire dure environ 4 minutes.</strong> Il est <strong>anonyme</strong> : nous ne demandons ni votre nom, ni votre adresse e-mail, et nous n'enregistrons pas votre adresse IP. Les réponses servent uniquement à ce travail universitaire.</p>
      ${radios("consentement", [["oui", "J'accepte de participer"], ["non", "Je ne souhaite pas participer"]])}
    </div>`,
    check: f => f.consentement ? "" : "Indiquez si vous acceptez de participer.",
    stop: f => f.consentement === "non" },

  /* Questions 1 à 3 · Vos habitudes */
  { id: "habitudes", html: () => `<div class="step">
      <h2>Vos habitudes au cinéma</h2>
      ${question("derniere_seance", "1. Quand êtes-vous allé au cinéma pour la dernière fois ?", [["1s", "Il y a moins d'une semaine"], ["2s", "Il y a 1 à 2 semaines"], ["1m", "Il y a 2 semaines à 1 mois"], ["3m", "Il y a 1 à 3 mois"], ["6m", "Il y a 3 à 6 mois"], ["12m", "Il y a 6 mois à 1 an"], ["24m", "Il y a 1 à 2 ans"], ["plus", "Il y a plus de 2 ans"], ["jamais", "Je n'y suis jamais allé"]])}
      ${question("dernier_achat", "2. Lors de cette dernière séance, qu'avez-vous acheté ?", [["place", "La place seulement"], ["place_plus", "La place + popcorn ou boisson"], ["place_popcorn_boisson", "La place + popcorn + boisson"], ["nsp", "Je ne m'en souviens pas, ou je n'y suis jamais allé"]])}
      ${euro("depense", "3. En général, combien dépensez-vous en popcorn, boissons et confiseries par séance ? (0 si vous n'en achetez jamais)")}
    </div>`,
    check: f => {
      if (!f.derniere_seance || !f.dernier_achat || !f.depense) return "Répondez aux trois questions.";
      if (!isAmount(f.depense)) return "Pour la dépense, écrivez seulement un montant en euros, par exemple 0, 6 ou 8,50.";
      return "";
    } },

  /* Questions 4 et 5 · Les deux matrices */
  { id: "matrices", html: () => `<div class="step">
      <h2>La confiserie et l'achat de votre place</h2>
      ${matrix("4. Êtes-vous d'accord avec ces phrases ?", FREINS, AGREE5)}
      ${matrix("5. Comment achetez-vous votre place de cinéma ?", CANAUX, FREQ3)}
    </div>`,
    check: f => FREINS.concat(CANAUX).every(([n]) => f[n]) ? "" : "Répondez à chaque ligne des deux tableaux." },

  /* L'offre, version A ou B tirée au sort */
  { id: "offre", button: "J'ai regardé l'offre", html: () => `<div class="step">
      <h2>Voici l'offre</h2>
      <p>Regardez-la attentivement : les questions suivantes portent sur elle.</p>
      ${offerHTML(false)}
    </div>`, check: () => "" },

  /* Question 6 · Van Westendorp */
  { id: "vw", html: () => `<div class="step">
      <h2>6. Pour ce pack, à partir de quel prix…</h2>
      ${offerHTML(false)}
      ${euro("vw_bon_marche", "…le trouveriez-vous <strong>bon marché</strong>, une bonne affaire ?")}
      ${euro("vw_cher", "…le trouveriez-vous <strong>cher</strong>, mais vous pourriez quand même l'acheter ?")}
      ${euro("vw_trop_cher", "…le trouveriez-vous <strong>trop cher</strong> pour l'acheter ?")}
      ${euro("vw_trop_bon_marche", "…le trouveriez-vous <strong>trop bon marché</strong>, au point de douter de sa qualité ?")}
    </div>`,
    check: f => {
      const keys = ["vw_bon_marche", "vw_cher", "vw_trop_cher", "vw_trop_bon_marche"];
      if (!keys.every(k => f[k])) return "Indiquez un prix pour chacune des quatre questions.";
      if (!keys.every(k => isAmount(f[k]))) return "Écrivez seulement un montant en euros, par exemple 15 ou 17,50.";
      return "";
    } },

  /* Question 7 · Gabor-Granger */
  { id: "gg", html: () => `<div class="step">
      <h2>7. Achèteriez-vous ce pack à ces prix ?</h2>
      ${offerHTML(false)}
      ${CONFIG.GG_PRIX.map((p, i) => `<div class="gg-row"><span class="p">${fmt(p)}</span><span class="yn"><label><input type="radio" name="gg_${i}" value="oui"> Oui</label><label><input type="radio" name="gg_${i}" value="non"> Non</label></span></div>`).join("")}
    </div>`,
    check: f => CONFIG.GG_PRIX.every((_, i) => f["gg_" + i]) ? "" : "Répondez oui ou non pour chaque prix." },

  /* Question 8 · Contrôle (sans l'offre affichée) */
  { id: "controle", html: () => `<div class="step">
      ${question("controle", "8. Dans la description du pack, était-il indiqué combien coûtent la place, le popcorn et la boisson si on les achète séparément ?", [["oui", "Oui"], ["non", "Non"], ["nsp", "Je ne sais pas"]])}
    </div>`,
    check: f => f.controle ? "" : "Choisissez une réponse." },

  /* Questions 9 et 10 · Toutes les échelles de Likert ensemble */
  { id: "likert_pack", html: () => `<div class="step">
      <h2>Imaginons que ce pack soit proposé à ${fmt(CONFIG.PRIX_PACK)}.</h2>
      ${offerHTML(true)}
      <p><strong>Pour chaque phrase, choisissez de 1 (pas du tout d'accord) à 7 (tout à fait d'accord).</strong></p>
      <h3>9. Ce que vous pensez du pack</h3>
      ${VALEUR.map(([n, l]) => scale7(n, l)).join("")}
      <h3>10. Votre envie de l'acheter</h3>
      ${INTENTION.map(([n, l]) => scale7(n, l)).join("")}
    </div>`,
    check: f => ITEMS_7.every(([n]) => f[n]) ? "" : "Répondez aux huit phrases." },

  /* Questions 11 et 12 · Les choix sur le pack */
  { id: "choix_pack", html: () => `<div class="step">
      <h2>Le pack et vous</h2>
      ${question("pourquoi_pack", "11. Qu'est-ce qui vous donnerait le plus envie de prendre ce pack plutôt que la place seule ?", [["economie", "L'économie par rapport aux produits achetés séparément"], ["pratique", "Tout acheter en une fois, en ligne avec ma place"], ["queue", "Ne pas faire la queue au comptoir"], ["rien", "Rien : je préfère la place seule"]])}
      ${question("format", "12. Quel format de pack vous intéresserait le plus ?", [["solo", "Solo"], ["duo", "Duo"], ["famille", "Famille"]])}
    </div>`,
    check: f => (f.pourquoi_pack && f.format) ? "" : "Répondez aux deux questions." },

  /* Questions 13 et 14 · Pathé ou CGR */
  { id: "concurrence", html: () => `<div class="step">
      <h2>Pathé et CGR, les deux grands cinémas de Clermont-Ferrand</h2>
      ${question("cmp_prix", "13. Selon vous, lequel est le moins cher ?", [["pathe", "Pathé (Aubière)"], ["cgr", "CGR (Val Arena)"], ["pareil", "C'est pareil"], ["nsp", "Je ne sais pas"]])}
      ${question("cmp_qualite", "14. Selon vous, lequel offre la meilleure expérience (confort, image, son) ?", [["pathe", "Pathé (Aubière)"], ["cgr", "CGR (Val Arena)"], ["pareil", "C'est pareil"], ["nsp", "Je ne sais pas"]])}
    </div>`,
    check: f => (f.cmp_prix && f.cmp_qualite) ? "" : "Répondez aux deux questions." },

  /* Questions 15 et 16 · Le streaming */
  { id: "streaming", html: () => `<div class="step">
      <h2>Les films à la maison</h2>
      ${checks("plateformes", "15. À quelles plateformes de vidéo êtes-vous abonné aujourd'hui (vous ou votre foyer) ? Plusieurs réponses possibles.", [["netflix", "Netflix"], ["disney", "Disney+"], ["prime", "Prime Video"], ["canal", "Canal+"], ["autre", "Une autre plateforme"], ["aucune", "Aucune"]])}
      ${euro("depense_streaming", "16. Combien votre foyer paie-t-il au total par mois pour ces abonnements ? (0 si aucun)")}
    </div>`,
    check: f => {
      if (!f.plateformes) return "Cochez au moins une plateforme (ou « Aucune »).";
      if (f.plateformes.split(";").includes("aucune") && f.plateformes.includes(";")) return "Vous avez coché « Aucune » et une plateforme : corrigez votre réponse.";
      if (!f.depense_streaming || !isAmount(f.depense_streaming)) return "Indiquez un montant en euros, par exemple 0 ou 13,99.";
      return "";
    } },

  /* Questions 17 à 19 · Profil */
  { id: "profil", button: "Envoyer mes réponses", html: () => `<div class="step">
      <h2>Pour finir, quelques questions sur vous</h2>
      ${question("situation", "17. Quelle est votre situation ?", [["etudiant", "Étudiant"], ["actif", "Actif"], ["retraite", "Retraité"], ["autre", "Autre"]])}
      ${question("avec_qui", "18. Le plus souvent, vous allez au cinéma…", [["seul", "Seul"], ["couple", "En couple"], ["famille", "En famille"], ["amis", "Entre amis"], ["jamais", "Je n'y vais pas"]])}
      ${question("cinema", "19. Dans quel cinéma allez-vous le plus souvent ?", [["pathe", "Pathé"], ["cgr", "CGR"], ["ugc", "UGC"], ["autre", "Un autre cinéma"], ["aucun", "Aucun"]])}
    </div>`,
    check: f => ["situation", "avec_qui", "cinema"].every(k => f[k]) ? "" : "Répondez à toutes les questions de cette page." }
];

/* ---------- moteur ---------- */
const stepsEl = document.getElementById("steps"), errEl = document.getElementById("err");
const nextBtn = document.getElementById("next"), prevBtn = document.getElementById("prev");
let cur = 0;
if (!CONFIG.ENDPOINT) document.getElementById("testmode").hidden = false;

function collect() {
  const f = {};
  stepsEl.querySelectorAll("input, select").forEach(i => {
    if (i.type === "radio") { if (i.checked) f[i.name] = i.value; }
    else if (i.type === "checkbox") { if (i.checked) f[i.name] = f[i.name] ? f[i.name] + ";" + i.value : i.value; else if (!(i.name in f)) f[i.name] = ""; }
    else if (i.tagName === "SELECT") f[i.name] = i.value;
    else f[i.name] = i.value.trim().replace(/\s|€/g, "").replace(",", ".");
  });
  return f;
}
function restore() {
  stepsEl.querySelectorAll("input, select").forEach(i => {
    const v = answers[i.name];
    if (v == null) return;
    if (i.type === "radio") i.checked = i.value === v;
    else if (i.type === "checkbox") i.checked = String(v).split(";").includes(i.value);
    else i.value = v;
  });
}
function render() {
  const s = STEPS[cur];
  stepsEl.innerHTML = s.html();
  restore();
  errEl.textContent = "";
  prevBtn.hidden = cur === 0;
  nextBtn.textContent = s.button || "Suivant";
  document.getElementById("progress").style.width = (cur / STEPS.length * 100) + "%";
  document.getElementById("count").textContent = `Étape ${cur + 1} sur ${STEPS.length}`;
  window.scrollTo(0, 0);
}
function endScreen(msg) {
  document.getElementById("form").innerHTML = `<div class="step"><h1>Merci !</h1><p>${msg}</p></div>`;
  document.getElementById("progress").style.width = "100%";
  document.getElementById("count").textContent = "";
}

function buildRow() {
  const n = k => (answers[k] === "" || answers[k] == null) ? "" : Number(answers[k]);
  const s = k => answers[k] == null ? "" : answers[k];
  const vw = [n("vw_trop_bon_marche"), n("vw_bon_marche"), n("vw_cher"), n("vw_trop_cher")];
  const vwOk = vw.every(v => v !== "" && !isNaN(v)) && vw[0] <= vw[1] && vw[1] <= vw[2] && vw[2] <= vw[3];
  // Gabor-Granger : prix décroissants ; accepter un prix plus élevé puis refuser un plus bas = incohérent
  const gg = CONFIG.GG_PRIX.map((_, i) => answers["gg_" + i]);
  let ggOk = true, seenYes = false;
  gg.forEach(a => { if (a === "oui") seenYes = true; else if (seenYes) ggOk = false; });
  const row = {
    id: answers.id, horodatage: new Date().toISOString(), version: VERSION,
    derniere_seance: s("derniere_seance"), dernier_achat: s("dernier_achat"),
    type_client: answers.dernier_achat === "place" ? "A_place_seule" : (answers.dernier_achat === "nsp" ? "" : "B_avec_confiserie"),
    depense: n("depense")
  };
  FREINS.concat(CANAUX).forEach(([k]) => { row[k] = FREINS.some(x => x[0] === k) ? n(k) : s(k); });
  Object.assign(row, { vw_trop_bon_marche: vw[0], vw_bon_marche: vw[1], vw_cher: vw[2], vw_trop_cher: vw[3], vw_coherent: vwOk ? 1 : 0 });
  CONFIG.GG_PRIX.forEach((p, i) => { row["gg_" + p.toFixed(2).replace(".", "_")] = gg[i] === "oui" ? 1 : 0; });
  row.gg_coherent = ggOk ? 1 : 0;
  row.controle = s("controle");
  row.controle_ok = (VERSION === "B" ? answers.controle === "oui" : answers.controle === "non") ? 1 : 0;
  ITEMS_7.forEach(([k]) => { row[k] = n(k); });
  Object.assign(row, {
    pourquoi_pack: s("pourquoi_pack"), format: s("format"),
    cmp_prix: s("cmp_prix"), cmp_qualite: s("cmp_qualite"),
    plateformes: s("plateformes"), depense_streaming: n("depense_streaming"),
    situation: s("situation"), avec_qui: s("avec_qui"), cinema: s("cinema"),
    prix_separes_affiche: VERSION === "B" ? CONFIG.PRIX_SEPARES : "",
    prix_pack_affiche: CONFIG.PRIX_PACK,
    duree_sec: Math.round((Date.now() - START) / 1000)
  });
  return row;
}
async function send(row) {
  if (!CONFIG.ENDPOINT) { try { const k = "q-test-rows"; const a = JSON.parse(localStorage.getItem(k) || "[]"); a.push(row); localStorage.setItem(k, JSON.stringify(a)); } catch (e) {} console.log("Réponse (mode test) :", row); return true; }
  try {
    await fetch(CONFIG.ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(row) });
    return true;
  } catch (e) { return false; }
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = collect();
  const s = STEPS[cur];
  const msg = s.check(f);
  if (msg) { errEl.textContent = msg; return; }
  Object.assign(answers, f);
  if (s.stop && s.stop(f)) { endScreen("Vous avez choisi de ne pas participer. Bonne journée !"); return; }
  if (cur < STEPS.length - 1) { cur++; render(); return; }
  nextBtn.disabled = true; nextBtn.textContent = "Envoi…";
  const ok = await send(buildRow());
  if (ok) endScreen("Vos réponses ont bien été enregistrées. Merci pour votre participation !");
  else { nextBtn.disabled = false; nextBtn.textContent = "Réessayer l'envoi"; errEl.textContent = "L'envoi n'a pas fonctionné. Vérifiez votre connexion internet, puis réessayez."; }
});
prevBtn.addEventListener("click", () => { Object.assign(answers, collect()); if (cur > 0) { cur--; render(); } });
render();

</script>
</body>
</html>
